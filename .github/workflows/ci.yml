name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      # Install exactly what the lockfile pins; fails if package.json and
      # bun.lock disagree, so dependency changes must be committed together.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Production build
        run: bun run build

      - name: Test suite
        run: bun run test
